# ==============================================================================
# 诈醒学集 — Docker Compose 生产编排模板
# 用法: docker compose up --build -d
#
# 说明：
# - 默认启用 PostgreSQL 作为生产数据库（替换 SQLite）。
# - 如需保留本地 SQLite 演示，可将 backend 服务 environment 中的 DATABASE_URL
#   注释掉，并取消 volumes 里 db-data 的挂载。
# - 生产环境务必替换 POSTGRES_PASSWORD 和 APP_SECRET，且不要提交到代码仓库。
# ==============================================================================

services:
  # ---- 数据库 ----
  postgres:
    image: postgres:15-alpine
    container_name: fraud-pet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fraud_pet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeInProduction}
      POSTGRES_DB: fraud_pet
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_pet -d fraud_pet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "127.0.0.1:5432:5432"

  # ---- 后端服务 ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fraud-pet-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+psycopg2://fraud_pet:${POSTGRES_PASSWORD:-ChangeMeInProduction}@postgres:5432/fraud_pet
      - AUTH_REQUIRED=true
      - APP_SECRET=${APP_SECRET:-ReplaceWithStrongRandomSecret}
      # 如需接入真实 AI API，取消下方注释并填写密钥
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      # - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- 前端服务 ----
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 生产环境请替换为真实域名
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: fraud-pet-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
